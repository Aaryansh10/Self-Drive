bt:
  ros__parameters:
    detections_topic: /tracked_obstacles
    lane_follow_enable_topic: /lane_follow/enable   # path_bridge gate 
    lane_change_action: lane_change
    tick_rate: 20.0
    stale_timeout: 1.0            # sec without a detection list -> decision falls back to none
    lane_change_min_retry: 4.0    # sec, retry lockout after a FAILED lane change goal (a success never blocks the next obstacle)

    # detection filtering
    min_score: 0.5
    min_points: 1
    min_distance: 2.0             # m, obstacle noise cutoff; stop lines remain valid down to 0 m
    confirm_change: 4             # consecutive detection lists before CHANGE is reported
    confirm_stop: 2               # consecutive detection lists before STOP is reported
    hold_time: 0.5                # s, an action survives brief detection dropouts
    handled_ttl: 30.0             # s, forget a handled obstacle id after this long unseen
    pseudo_ttl: 2.0               # s, forget a handled id-less obstacle after this long unseen
    same_obstacle_tol: 0.5        # m, id-less matching: distance may grow this much and still be the same obstacle

    # Explicit is_stop_sign=true + sign_real_prob >= threshold is required.
    # The current generic-sign detector does not supply authenticity; connect its
    # classified DetectionArray through fusion. Both real and fake signs use
    # Detection2D.distance from this depth-enriched topic (already stop-line depth).
    sign_detections_topic: /detections_depth
    stop_sign_class: sign
    sign_real_threshold: 0.5
    stop_line_topic: /pc_stopline  # fallback only when no recent sign detection exists
    stop_line_min_points: 5
    stop_line_half_width: 1.2
    intersection_input_max_age: 0.5
    intersection_tf_tolerance: 0.1 # max timestamp skew for a fallback world-position anchor; 0 disables
    intersection_min_retry: 2.0
    intersection_server_wait_timeout: 5.0 # seconds for initial DDS action-server discovery
    intersection_action: intersection
    intersection_turns: ["straight"]
    road_width: 7.4               # In m
    confirm_intersection: 3
    intersection_hold: 20.0
    stop_sign_ttl: 20.0

    # Obstacles come from /tracked_obstacles; sign/stopline are synthesized from
    # the independent intersection inputs above. action = stop | change | intersection | none
    class_name: ["pedestrian", "sign", "barrel", "tyre", "pothole", "stopline"]
    classes:
      pedestrian: {action: stop, trigger_distance: 5.0}
      sign:   {action: none, trigger_distance: 8.0, mark_stop_sign: true}
      barrel:     {action: change, trigger_distance: 3.96}
      tyre:        {action: change, trigger_distance: 3.96}
      pothole:    {action: change, trigger_distance: 3.96}
      stopline: {action: intersection, trigger_distance: 3.96}
