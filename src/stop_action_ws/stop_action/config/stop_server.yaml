stop_action_server:
  ros__parameters:
    use_sim_time: true

    detection_topic: /detections
    odom_topic: /odom
    cmd_vel_topic: /cmd_vel_stop        

    
    control_rate_hz: 20.0
    a_comfort: 1.0                      
    a_max: 2.5                          
    latency: 0.15                       
    target_fraction: 0.5                
    stop_speed_threshold: 0.03          
    sensor_to_front_offset: 0.0         

    detection_timeout: 0.5              
    dead_reckon_timeout: 3.0            
    filter_window: 5                    
    min_score: 0.3
    require_in_lane: true

    profile_names: [barrel, stop_line, mannequin]
    profiles:
      barrel:
        min_distance: 0.3
        max_distance: 0.9
        max_speed: 2.2
      stop_line:
        min_distance: 0.05
        max_distance: 0.3
        max_speed: 2.2
      mannequin:
        min_distance: 1.5
        max_distance: 2.1
        max_speed: 2.2