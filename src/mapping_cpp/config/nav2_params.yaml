controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001    
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3             

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker" 
      required_movement_radius: 0.5    
      movement_time_allowance: 6.0    
                                        
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.2          
      yaw_goal_tolerance: 0.1        
      stateful: true
 
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 1.0
      lookahead_dist: 5.0
      min_lookahead_dist: 1.5
      max_lookahead_dist: 5.8
      lookahead_time: 1.5
      transform_tolerance: 0.2
 
      # --- Lookahead scaling ---
      use_velocity_scaled_lookahead_dist: true
      min_approach_velocity: 0.05
      approach_velocity_scaling_dist: 0.6      
      
                                        
      # --- Regulated velocity scaling ---
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.50
      regulated_linear_scaling_min_speed: 0.2

      # --- Collision detection ---
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0

      # --- Kinematic & Ackermann constraints ---
      use_rotate_to_heading: false        # False for Ackermann / non-holonomic robots
      allow_reversing: false
      max_angular_accel: 3.0
      max_linear_accel: 1.5


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true

      global_frame: odom
      robot_base_frame: link_base
      rolling_window: true             

      update_frequency: 20.0
      publish_frequency: 5.0

      width: 20                       
      height: 20
      resolution: 0.1

      robot_radius: 0.0
      footprint: "[ [0.50, 0.48], [0.50, -0.48], [-0.50, -0.48], [-0.50, 0.48] ]"
      footprint_padding: 0.0
 
      transform_tolerance: 0.3

      plugins:
      - "plugin_physical_obstacles"   # barrels + tyres + pedestrians (lidar) + potholes (vision)
      - "plugin_container_lanes"       # lane boundary (vision)

      plugin_physical_obstacles:
        plugin: "nav2_costmap_2d::PluginContainerLayer"
        enabled: true
        combination_method: 1            # Max
        plugins: ["obstacle_layer", "inflation_layer"]

        obstacle_layer:                     
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: true
          observation_sources: obstacle_detector obstacle_clearer

          obstacle_detector:
            topic: /obstacle_cloud
            data_type: PointCloud2
            sensor_frame: "link_lidar"
            marking: true
            clearing: false
            max_obstacle_height: 2.5
            min_obstacle_height: 0.0
            obstacle_max_range: 10.0      
            obstacle_min_range: 0.0
            raytrace_max_range: 0.0
            raytrace_min_range: 0.0
            
          obstacle_clearer:
            topic: /clearing_cloud
            data_type: PointCloud2
            sensor_frame: "link_lidar"
            marking: false
            clearing: true
            max_obstacle_height: 2.5
            min_obstacle_height: -0.1
            obstacle_max_range: 10.0
            obstacle_min_range: 0.0
            raytrace_max_range: 15.0
            raytrace_min_range: 0.0
            
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          inflation_radius: 0.4
          cost_scaling_factor: 40.0

      plugin_container_lanes:
        plugin: "nav2_costmap_2d::PluginContainerLayer"
        enabled: true
        combination_method: 1
        plugins: ["lane_layer", "denoise_layer", "inflation_layer"]

        lane_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: true
          observation_sources: lane_detector lane_clearer lidar_clearer

          lane_detector:
            topic: /lane_pc
            data_type: "PointCloud2"
            sensor_frame: "link_base"
            marking: true
            clearing: false
            min_obstacle_height: -0.5
            max_obstacle_height: 0.5
            obstacle_max_range: 10.0
            raytrace_max_range: 0.0

          lane_clearer:
            topic: /vision_clear_pc
            data_type: "PointCloud2"
            sensor_frame: "link_base"
            marking: false
            clearing: true
            min_obstacle_height: -0.5
            max_obstacle_height: 0.5
            obstacle_max_range: 15.0
            raytrace_max_range: 15.0

          lidar_clearer:
            topic: /clearing_cloud
            data_type: "PointCloud2"
            sensor_frame: "link_lidar"
            marking: false
            clearing: true
            min_obstacle_height: -0.5     # match pothole_layer's own height filter, not LiDAR's
            max_obstacle_height: 0.5
            obstacle_max_range: 15.0
            raytrace_max_range: 15.0

        denoise_layer:
          plugin: "nav2_costmap_2d::DenoiseLayer"
          enabled: true
          minimal_group_size: 3        
          group_connectivity_type: 8

        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          inflation_radius: 0.1        # just enough for ObstaclesCritic to feel it — not enough to close narrow corridors
          cost_scaling_factor: 15.0

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 25.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [1.0, 0.0, 1.2]     # [vx, vy, wz] 
    min_velocity: [-0.5, 0.0, -1.2]
    max_accel: [1.5, 0.0, 3.0]
    max_decel: [-1.5, 0.0, -3.0]
    odom_topic: "odometry/local"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    bond_timeout: 4.0
    node_names:
      - "controller_server"
      - "velocity_smoother"