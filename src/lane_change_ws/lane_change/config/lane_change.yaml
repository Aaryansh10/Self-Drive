lane_change_server:
  ros__parameters:
    # ---- topics / frames ----
    odom_topic: /odom
    centerline_1_topic: /centerline/lane_1      # nav_msgs/Path, BASE frame (x fwd, y left)
    centerline_2_topic: /centerline/lane_2      # nav_msgs/Path, BASE frame
    current_lane_topic: /current_lane           # std_msgs/Int32, 1 or 2 (set by the BT / lane follower)
    cmd_vel_topic: /lane_change/cmd_vel         # twist_mux input
    active_topic: /lane_change/active           # std_msgs/Bool, true while this node owns the velocity
    path_topic: /lane_change/path               # transition + target centreline, odom frame, only while the lane change is active
    base_frame: link_base
    output_mode: path                           # path = publish nav_msgs/Path for Nav2 (default) | cmd_vel = drive directly
    path_frame: ""                              # "" = use the frame of the odometry message (e.g. odom)
    slow_down: true                             # publish a Nav2 /speed_limit while changing lanes, released afterwards
    speed_limit_topic: /speed_limit
    use_stamped_cmd: false                      # true -> geometry_msgs/TwistStamped
    rate_hz: 20.0
    odom_timeout: 0.5
    # ---- geometry ----
    lane_width: 3.048
    robot_width: 0.90
    front_offset: 0.50
    body_clear_margin: 0.10
    distance_is_from_base: true
    # ---- rule window ----
    completion_distance: 3.505
    window_min: 3.048
    window_max: 3.962
    completion_at_center: false
    # ---- manoeuvre ----
    nominal_length: 8.0
    tracking_lag_s: 0.05
    line_smooth: 0.4
    max_lat_accel: 1.2
    allow_late_compress: true
    speed_ratio: 0.85
    min_speed: 0.60
    max_speed: 2.20
    max_accel: 0.80
    lookahead_min: 1.2
    lookahead_gain: 0.6
    lookahead_max: 3.0
    max_wz: 1.2
    path_length: 10.0
    min_turn_radius: 6.0                        # m, SET THIS to the car's real minimum turning radius (longer, gentler transition when larger)
    settle_lat_tol: 0.20
    settle_yaw_tol: 0.14
    settle_distance: 0.8
    settle_timeout: 12.0
    min_lateral_shift: 1.5
    max_shift_factor: 1.7
    lost_timeout: 2.0
    wait_timeout: 90.0
    max_change_time: 40.0
